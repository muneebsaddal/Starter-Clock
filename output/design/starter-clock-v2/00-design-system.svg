<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="844" viewBox="0 0 1200 844">
<title>Starter Clock design system</title>
<style>text{font-family:'DM Sans','Segoe UI',Arial,sans-serif;font-variant-numeric:tabular-nums lining-nums;}</style>
<rect x="0" y="0" width="1200" height="844" rx="0" fill="#F3F6F4"/>
<g id="Title">
<text x="48" y="58" font-size="30" font-weight="600" fill="#1F2924" text-anchor="start" letter-spacing="0">Starter Clock</text>
<text x="48" y="84" font-size="14" font-weight="500" fill="#68736D" text-anchor="start" letter-spacing="0">Cool Quiet System / v3</text>
<rect x="1016" y="42" width="136" height="30" rx="15" fill="#D8E8E1"/>
<text x="1084.0" y="62" font-size="12" font-weight="600" fill="#2F5547" text-anchor="middle" letter-spacing="0">DM SANS</text>
</g>
<g id="Palette">
<rect x="48" y="112" width="520" height="216" rx="22" fill="#FFFFFF" stroke="#D7E0DB" stroke-width="1"/>
<text x="72" y="146" font-size="18" font-weight="600" fill="#1F2924" text-anchor="start" letter-spacing="0">Color</text>
<text x="72" y="167" font-size="12" font-weight="400" fill="#68736D" text-anchor="start" letter-spacing="0">Cool mineral neutrals with one restrained sage accent.</text>
<rect x="72" y="192" width="42" height="42" rx="11" fill="#F3F6F4" stroke="#D7E0DB" stroke-width="1"/>
<text x="124" y="210" font-size="12" font-weight="500" fill="#1F2924" text-anchor="start" letter-spacing="0">Mist</text>
<text x="124" y="227" font-size="10" font-weight="400" fill="#68736D" text-anchor="start" letter-spacing="0">#F3F6F4</text>
<rect x="232" y="192" width="42" height="42" rx="11" fill="#FFFFFF" stroke="#D7E0DB" stroke-width="1"/>
<text x="284" y="210" font-size="12" font-weight="500" fill="#1F2924" text-anchor="start" letter-spacing="0">Paper</text>
<text x="284" y="227" font-size="10" font-weight="400" fill="#68736D" text-anchor="start" letter-spacing="0">#FFFFFF</text>
<rect x="392" y="192" width="42" height="42" rx="11" fill="#1F2924"/>
<text x="444" y="210" font-size="12" font-weight="500" fill="#1F2924" text-anchor="start" letter-spacing="0">Ink</text>
<text x="444" y="227" font-size="10" font-weight="400" fill="#68736D" text-anchor="start" letter-spacing="0">#1F2924</text>
<rect x="72" y="250" width="42" height="42" rx="11" fill="#426B5A"/>
<text x="124" y="268" font-size="12" font-weight="500" fill="#1F2924" text-anchor="start" letter-spacing="0">Sage</text>
<text x="124" y="285" font-size="10" font-weight="400" fill="#68736D" text-anchor="start" letter-spacing="0">#426B5A</text>
<rect x="232" y="250" width="42" height="42" rx="11" fill="#6D8793"/>
<text x="284" y="268" font-size="12" font-weight="500" fill="#1F2924" text-anchor="start" letter-spacing="0">Slate</text>
<text x="284" y="285" font-size="10" font-weight="400" fill="#68736D" text-anchor="start" letter-spacing="0">#6D8793</text>
<rect x="392" y="250" width="42" height="42" rx="11" fill="#D7E0DB"/>
<text x="444" y="268" font-size="12" font-weight="500" fill="#1F2924" text-anchor="start" letter-spacing="0">Line</text>
<text x="444" y="285" font-size="10" font-weight="400" fill="#68736D" text-anchor="start" letter-spacing="0">#D7E0DB</text>
</g>
<g id="Typography">
<rect x="48" y="350" width="520" height="258" rx="22" fill="#FFFFFF" stroke="#D7E0DB" stroke-width="1"/>
<text x="72" y="384" font-size="18" font-weight="600" fill="#1F2924" text-anchor="start" letter-spacing="0">Typography</text>
<text x="72" y="405" font-size="12" font-weight="400" fill="#68736D" text-anchor="start" letter-spacing="0">DM Sans keeps the product neutral, friendly, and platform-safe.</text>
<text x="72" y="452" font-size="10" font-weight="500" fill="#68736D" text-anchor="start" letter-spacing="0">Display</text>
<text x="160" y="454" font-size="30" font-weight="600" fill="#1F2924" text-anchor="start" letter-spacing="0">Peak at 1:30 PM</text>
<text x="538" y="452" font-size="10" font-weight="400" fill="#68736D" text-anchor="end" letter-spacing="0">30 / 600</text>
<text x="72" y="494" font-size="10" font-weight="500" fill="#68736D" text-anchor="start" letter-spacing="0">Title</text>
<text x="160" y="496" font-size="24" font-weight="600" fill="#1F2924" text-anchor="start" letter-spacing="0">Log a feeding</text>
<text x="538" y="494" font-size="10" font-weight="400" fill="#68736D" text-anchor="end" letter-spacing="0">24 / 600</text>
<text x="72" y="536" font-size="10" font-weight="500" fill="#68736D" text-anchor="start" letter-spacing="0">Section</text>
<text x="160" y="538" font-size="15" font-weight="600" fill="#1F2924" text-anchor="start" letter-spacing="0">Last feeding</text>
<text x="538" y="536" font-size="10" font-weight="400" fill="#68736D" text-anchor="end" letter-spacing="0">15 / 600</text>
<text x="72" y="578" font-size="10" font-weight="500" fill="#68736D" text-anchor="start" letter-spacing="0">Body</text>
<text x="160" y="580" font-size="13" font-weight="400" fill="#1F2924" text-anchor="start" letter-spacing="0">Based on 1:2:2 at 24 C</text>
<text x="538" y="578" font-size="10" font-weight="400" fill="#68736D" text-anchor="end" letter-spacing="0">13 / 400</text>
<text x="72" y="620" font-size="10" font-weight="500" fill="#68736D" text-anchor="start" letter-spacing="0">Label</text>
<text x="160" y="622" font-size="10" font-weight="600" fill="#1F2924" text-anchor="start" letter-spacing="0">ESTIMATED PEAK</text>
<text x="538" y="620" font-size="10" font-weight="400" fill="#68736D" text-anchor="end" letter-spacing="0">10 / 600</text>
</g>
<g id="Layout rules">
<rect x="48" y="630" width="520" height="166" rx="22" fill="#FFFFFF" stroke="#D7E0DB" stroke-width="1"/>
<text x="72" y="664" font-size="18" font-weight="600" fill="#1F2924" text-anchor="start" letter-spacing="0">Layout rules</text>
<circle cx="78" cy="695" r="3" fill="#426B5A"/>
<text x="91" y="699" font-size="11" font-weight="400" fill="#68736D" text-anchor="start" letter-spacing="0">24px screen margins and 18-24px section rhythm</text>
<circle cx="78" cy="719" r="3" fill="#426B5A"/>
<text x="91" y="723" font-size="11" font-weight="400" fill="#68736D" text-anchor="start" letter-spacing="0">50px primary actions; 48px minimum touch targets</text>
<circle cx="78" cy="743" r="3" fill="#426B5A"/>
<text x="91" y="747" font-size="11" font-weight="400" fill="#68736D" text-anchor="start" letter-spacing="0">24px hero radius; 13-16px controls and utility cards</text>
<circle cx="78" cy="767" r="3" fill="#426B5A"/>
<text x="91" y="771" font-size="11" font-weight="400" fill="#68736D" text-anchor="start" letter-spacing="0">Use surfaces only for hierarchy, never card-on-card decoration</text>
</g>
<g id="Components">
<rect x="592" y="112" width="560" height="684" rx="22" fill="#FFFFFF" stroke="#D7E0DB" stroke-width="1"/>
<text x="616" y="146" font-size="18" font-weight="600" fill="#1F2924" text-anchor="start" letter-spacing="0">Components</text>
<text x="616" y="167" font-size="12" font-weight="400" fill="#68736D" text-anchor="start" letter-spacing="0">Quiet hierarchy, lighter weights, clear states.</text>
<text x="616" y="207" font-size="10" font-weight="600" fill="#68736D" text-anchor="start" letter-spacing="1.15">ACTIONS</text>
<rect x="616" y="223" width="238" height="50" rx="15" fill="#426B5A"/>
<text x="735.0" y="255" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">Log a feeding</text>
<rect x="866" y="223" width="238" height="46" rx="14" fill="#FFFFFF" stroke="#D7E0DB" stroke-width="1"/>
<text x="985.0" y="252" font-size="14" font-weight="500" fill="#1F2924" text-anchor="middle" letter-spacing="0">Edit details</text>
<text x="616" y="309" font-size="10" font-weight="600" fill="#68736D" text-anchor="start" letter-spacing="1.15">INPUTS AND SELECTION</text>
<text x="616" y="321" font-size="11" font-weight="500" fill="#68736D" text-anchor="start" letter-spacing="0">Starter amount</text>
<rect x="616" y="331" width="238" height="50" rx="13" fill="#FFFFFF" stroke="#D7E0DB" stroke-width="1"/>
<text x="630" y="363" font-size="15" font-weight="500" fill="#1F2924" text-anchor="start" letter-spacing="0">25</text>
<text x="841" y="363" font-size="12" font-weight="400" fill="#68736D" text-anchor="end" letter-spacing="0">g</text>
<rect x="866" y="344" width="74" height="30" rx="15" fill="#FFFFFF" stroke="#D7E0DB" stroke-width="1"/>
<text x="903.0" y="364" font-size="12" font-weight="500" fill="#1F2924" text-anchor="middle" letter-spacing="0">1:1:1</text>
<rect x="950" y="344" width="74" height="30" rx="15" fill="#426B5A"/>
<text x="987.0" y="364" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">1:2:2</text>
<rect x="1034" y="344" width="70" height="30" rx="15" fill="#FFFFFF" stroke="#D7E0DB" stroke-width="1"/>
<text x="1069.0" y="364" font-size="12" font-weight="500" fill="#1F2924" text-anchor="middle" letter-spacing="0">Custom</text>
<text x="616" y="425" font-size="10" font-weight="600" fill="#68736D" text-anchor="start" letter-spacing="1.15">STATUS AND FEEDBACK</text>
<rect x="616" y="441" width="78" height="30" rx="15" fill="#D8E8E1"/>
<text x="655.0" y="461" font-size="12" font-weight="600" fill="#2F5547" text-anchor="middle" letter-spacing="0">RISING</text>
<rect x="706" y="441" width="84" height="30" rx="15" fill="#E4ECEF"/>
<text x="748.0" y="461" font-size="12" font-weight="600" fill="#6D8793" text-anchor="middle" letter-spacing="0">REMINDER</text>
<rect x="802" y="441" width="72" height="30" rx="15" fill="#F4E6E8"/>
<text x="838.0" y="461" font-size="12" font-weight="600" fill="#B24C55" text-anchor="middle" letter-spacing="0">LATE</text>
<text x="616" y="515" font-size="10" font-weight="600" fill="#68736D" text-anchor="start" letter-spacing="1.15">PEAK CARD</text>
<rect x="616" y="530" width="488" height="210" rx="20" fill="#F8FAF9" stroke="#D7E0DB" stroke-width="1"/>
<text x="640" y="561" font-size="10" font-weight="600" fill="#68736D" text-anchor="start" letter-spacing="1.15">ESTIMATED PEAK</text>
<text x="640" y="599" font-size="28" font-weight="600" fill="#1F2924" text-anchor="start" letter-spacing="0">1:30-3:15 PM</text>
<text x="640" y="623" font-size="12" font-weight="400" fill="#68736D" text-anchor="start" letter-spacing="0">Today - a 1h 45m window</text>
<rect x="640" y="649" width="440" height="8" rx="4" fill="#D7E0DB"/>
<rect x="640" y="649" width="250" height="8" rx="4" fill="#426B5A"/>
<circle cx="890" cy="653" r="7" fill="#FFFFFF" stroke="#426B5A" stroke-width="3"/>
<text x="640" y="686" font-size="13" font-weight="500" fill="#1F2924" text-anchor="start" letter-spacing="0">4h 20m until window</text>
<text x="1080" y="686" font-size="13" font-weight="500" fill="#1F2924" text-anchor="end" letter-spacing="0">7-9h from feeding</text>
<text x="640" y="719" font-size="11" font-weight="400" fill="#68736D" text-anchor="start" letter-spacing="0">Estimates are windows, not promises.</text>
</g>
</svg>