<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
<title>Starter Clock after save</title>
<style>text{font-family:'DM Sans','Segoe UI',Arial,sans-serif;font-variant-numeric:tabular-nums lining-nums;}</style>
<rect x="0" y="0" width="390" height="844" rx="0" fill="#F3F6F4"/>
<text x="24" y="24" font-size="11" font-weight="600" fill="#1F2924" text-anchor="start" letter-spacing="0">9:41</text>
<circle cx="342" cy="19" r="3" fill="#1F2924"/>
<rect x="350" y="15" width="14" height="8" rx="2" fill="#1F2924"/>
<rect x="369" y="15" width="10" height="8" rx="2" fill="#1F2924"/>
<g id="Confirmation">
<circle cx="195" cy="76" r="19" fill="#D8E8E1"/>
<line x1="186" y1="76" x2="192" y2="82" stroke="#426B5A" stroke-width="2.5" stroke-linecap="round"/>
<line x1="192" y1="82" x2="204" y2="69" stroke="#426B5A" stroke-width="2.5" stroke-linecap="round"/>
<text x="195" y="118" font-size="26" font-weight="600" fill="#1F2924" text-anchor="middle" letter-spacing="0">Feeding logged</text>
<text x="195" y="142" font-size="13" font-weight="400" fill="#68736D" text-anchor="middle" letter-spacing="0">Your reminder and estimate are ready.</text>
</g>
<g id="Peak window">
<rect x="24" y="181" width="342" height="244" rx="24" fill="#FFFFFF" stroke="#D7E0DB" stroke-width="1"/>
<text x="44" y="210" font-size="10" font-weight="600" fill="#68736D" text-anchor="start" letter-spacing="1.15">ESTIMATED PEAK</text>
<text x="44" y="248" font-size="28" font-weight="600" fill="#1F2924" text-anchor="start" letter-spacing="0">1:30-3:15 PM</text>
<text x="44" y="272" font-size="13" font-weight="400" fill="#68736D" text-anchor="start" letter-spacing="0">Today - a 1h 45m window</text>
<rect x="44" y="309" width="302" height="8" rx="4" fill="#D7E0DB"/>
<rect x="44" y="309" width="148" height="8" rx="4" fill="#426B5A"/>
<circle cx="192" cy="313" r="7" fill="#FFFFFF" stroke="#426B5A" stroke-width="3"/>
<text x="44" y="338" font-size="11" font-weight="500" fill="#68736D" text-anchor="start" letter-spacing="0">Now</text>
<text x="346" y="338" font-size="11" font-weight="500" fill="#68736D" text-anchor="end" letter-spacing="0">Peak window</text>
<text x="44" y="363" font-size="20" font-weight="600" fill="#1F2924" text-anchor="start" letter-spacing="0">4h 20m</text>
<text x="44" y="383" font-size="11" font-weight="400" fill="#68736D" text-anchor="start" letter-spacing="0">until window</text>
<line x1="186" y1="346" x2="186" y2="386" stroke="#D7E0DB" stroke-width="1" stroke-linecap="round"/>
<text x="208" y="363" font-size="20" font-weight="600" fill="#1F2924" text-anchor="start" letter-spacing="0">7-9h</text>
<text x="208" y="383" font-size="11" font-weight="400" fill="#68736D" text-anchor="start" letter-spacing="0">from feeding</text>
</g>
<g id="Actions">
<rect x="24" y="443" width="165" height="46" rx="14" fill="#FFFFFF" stroke="#D7E0DB" stroke-width="1"/>
<text x="106.5" y="472" font-size="14" font-weight="500" fill="#1F2924" text-anchor="middle" letter-spacing="0">Edit details</text>
<rect x="201" y="443" width="165" height="46" rx="14" fill="#FFFFFF" stroke="#D7E0DB" stroke-width="1"/>
<text x="283.5" y="472" font-size="14" font-weight="500" fill="#1F2924" text-anchor="middle" letter-spacing="0">Adjust reminder</text>
</g>
<g id="What happens next">
<text x="24" y="529" font-size="15" font-weight="600" fill="#1F2924" text-anchor="start" letter-spacing="0">What happens next</text>
<circle cx="40" cy="563" r="14" fill="#E4ECEF"/>
<text x="40" y="567" font-size="11" font-weight="600" fill="#6D8793" text-anchor="middle" letter-spacing="0">1</text>
<text x="64" y="562" font-size="13" font-weight="500" fill="#1F2924" text-anchor="start" letter-spacing="0">Reminder</text>
<text x="64" y="582" font-size="11" font-weight="400" fill="#68736D" text-anchor="start" letter-spacing="0">We will nudge you before the peak window.</text>
<circle cx="40" cy="624" r="14" fill="#E4ECEF"/>
<text x="40" y="628" font-size="11" font-weight="600" fill="#6D8793" text-anchor="middle" letter-spacing="0">2</text>
<text x="64" y="623" font-size="13" font-weight="500" fill="#1F2924" text-anchor="start" letter-spacing="0">Observe</text>
<text x="64" y="643" font-size="11" font-weight="400" fill="#68736D" text-anchor="start" letter-spacing="0">Record the actual peak when you notice it.</text>
<circle cx="40" cy="685" r="14" fill="#E4ECEF"/>
<text x="40" y="689" font-size="11" font-weight="600" fill="#6D8793" text-anchor="middle" letter-spacing="0">3</text>
<text x="64" y="684" font-size="13" font-weight="500" fill="#1F2924" text-anchor="start" letter-spacing="0">Improve</text>
<text x="64" y="704" font-size="11" font-weight="400" fill="#68736D" text-anchor="start" letter-spacing="0">Future estimates adapt to Mabel&#x27;s history.</text>
</g>
<g id="Return action">
<rect x="24" y="717" width="342" height="50" rx="15" fill="#426B5A"/>
<text x="195.0" y="749" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">Back to Today</text>
</g>
<rect x="0" y="775" width="390" height="69" rx="0" fill="#FFFFFF"/>
<line x1="0" y1="775" x2="390" y2="775" stroke="#D7E0DB" stroke-width="1" stroke-linecap="round"/>
<rect x="48" y="787" width="36" height="3" rx="2" fill="#426B5A"/>
<text x="66" y="816" font-size="12" font-weight="600" fill="#426B5A" text-anchor="middle" letter-spacing="0">Today</text>
<text x="195" y="816" font-size="12" font-weight="500" fill="#68736D" text-anchor="middle" letter-spacing="0">History</text>
<text x="324" y="816" font-size="12" font-weight="500" fill="#68736D" text-anchor="middle" letter-spacing="0">Settings</text>
</svg>