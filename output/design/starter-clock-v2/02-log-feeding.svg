<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
<title>Starter Clock log feeding</title>
<style>text{font-family:'DM Sans','Segoe UI',Arial,sans-serif;font-variant-numeric:tabular-nums lining-nums;}</style>
<rect x="0" y="0" width="390" height="844" rx="0" fill="#F3F6F4"/>
<text x="24" y="24" font-size="11" font-weight="600" fill="#1F2924" text-anchor="start" letter-spacing="0">9:41</text>
<circle cx="342" cy="19" r="3" fill="#1F2924"/>
<rect x="350" y="15" width="14" height="8" rx="2" fill="#1F2924"/>
<rect x="369" y="15" width="10" height="8" rx="2" fill="#1F2924"/>
<g id="Header">
<line x1="29" y1="55" x2="20" y2="64" stroke="#1F2924" stroke-width="2" stroke-linecap="round"/>
<line x1="20" y1="64" x2="29" y2="73" stroke="#1F2924" stroke-width="2" stroke-linecap="round"/>
<text x="48" y="68" font-size="25" font-weight="600" fill="#1F2924" text-anchor="start" letter-spacing="0">Log a feeding</text>
<text x="24" y="99" font-size="13" font-weight="400" fill="#68736D" text-anchor="start" letter-spacing="0">Use a saved ratio or enter exact amounts.</text>
</g>
<g id="Quick ratios">
<text x="24" y="133" font-size="10" font-weight="600" fill="#68736D" text-anchor="start" letter-spacing="1.15">QUICK RATIO</text>
<rect x="24" y="147" width="82" height="30" rx="15" fill="#FFFFFF" stroke="#D7E0DB" stroke-width="1"/>
<text x="65.0" y="167" font-size="12" font-weight="500" fill="#1F2924" text-anchor="middle" letter-spacing="0">1:1:1</text>
<rect x="114" y="147" width="82" height="30" rx="15" fill="#426B5A"/>
<text x="155.0" y="167" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">1:2:2</text>
<rect x="204" y="147" width="92" height="30" rx="15" fill="#FFFFFF" stroke="#D7E0DB" stroke-width="1"/>
<text x="250.0" y="167" font-size="12" font-weight="500" fill="#1F2924" text-anchor="middle" letter-spacing="0">Custom</text>
</g>
<g id="Amounts">
<text x="24" y="212" font-size="10" font-weight="600" fill="#68736D" text-anchor="start" letter-spacing="1.15">AMOUNTS</text>
<text x="24" y="226" font-size="11" font-weight="500" fill="#68736D" text-anchor="start" letter-spacing="0">Starter</text>
<rect x="24" y="236" width="106" height="50" rx="13" fill="#FFFFFF" stroke="#D7E0DB" stroke-width="1"/>
<text x="38" y="268" font-size="15" font-weight="500" fill="#1F2924" text-anchor="start" letter-spacing="0">25</text>
<text x="117" y="268" font-size="12" font-weight="400" fill="#68736D" text-anchor="end" letter-spacing="0">g</text>
<text x="142" y="226" font-size="11" font-weight="500" fill="#68736D" text-anchor="start" letter-spacing="0">Flour</text>
<rect x="142" y="236" width="106" height="50" rx="13" fill="#FFFFFF" stroke="#D7E0DB" stroke-width="1"/>
<text x="156" y="268" font-size="15" font-weight="500" fill="#1F2924" text-anchor="start" letter-spacing="0">50</text>
<text x="235" y="268" font-size="12" font-weight="400" fill="#68736D" text-anchor="end" letter-spacing="0">g</text>
<text x="260" y="226" font-size="11" font-weight="500" fill="#68736D" text-anchor="start" letter-spacing="0">Water</text>
<rect x="260" y="236" width="106" height="50" rx="13" fill="#FFFFFF" stroke="#D7E0DB" stroke-width="1"/>
<text x="274" y="268" font-size="15" font-weight="500" fill="#1F2924" text-anchor="start" letter-spacing="0">50</text>
<text x="353" y="268" font-size="12" font-weight="400" fill="#68736D" text-anchor="end" letter-spacing="0">g</text>
<rect x="24" y="305" width="342" height="42" rx="12" fill="#D8E8E1"/>
<text x="38" y="331" font-size="12" font-weight="600" fill="#2F5547" text-anchor="start" letter-spacing="0">Ratio 1:2:2</text>
<text x="352" y="331" font-size="12" font-weight="500" fill="#2F5547" text-anchor="end" letter-spacing="0">100% hydration</text>
</g>
<g id="Conditions">
<text x="24" y="384" font-size="10" font-weight="600" fill="#68736D" text-anchor="start" letter-spacing="1.15">CONDITIONS</text>
<text x="24" y="398" font-size="11" font-weight="500" fill="#68736D" text-anchor="start" letter-spacing="0">Temperature</text>
<rect x="24" y="408" width="165" height="50" rx="13" fill="#FFFFFF" stroke="#D7E0DB" stroke-width="1"/>
<text x="38" y="440" font-size="15" font-weight="500" fill="#1F2924" text-anchor="start" letter-spacing="0">24</text>
<text x="176" y="440" font-size="12" font-weight="400" fill="#68736D" text-anchor="end" letter-spacing="0">C</text>
<text x="201" y="398" font-size="11" font-weight="500" fill="#68736D" text-anchor="start" letter-spacing="0">Flour</text>
<rect x="201" y="408" width="165" height="50" rx="13" fill="#FFFFFF" stroke="#D7E0DB" stroke-width="1"/>
<text x="215" y="440" font-size="15" font-weight="500" fill="#1F2924" text-anchor="start" letter-spacing="0">Bread flour</text>
</g>
<g id="Optional details">
<text x="24" y="501" font-size="10" font-weight="600" fill="#68736D" text-anchor="start" letter-spacing="1.15">OPTIONAL DETAILS</text>
<rect x="24" y="515" width="342" height="106" rx="16" fill="#FFFFFF" stroke="#D7E0DB" stroke-width="1"/>
<text x="40" y="545" font-size="13" font-weight="500" fill="#1F2924" text-anchor="start" letter-spacing="0">Progress photo</text>
<text x="350" y="545" font-size="12" font-weight="600" fill="#6D8793" text-anchor="end" letter-spacing="0">Add later</text>
<line x1="40" y1="560" x2="350" y2="560" stroke="#D7E0DB" stroke-width="1" stroke-linecap="round"/>
<text x="40" y="590" font-size="13" font-weight="500" fill="#1F2924" text-anchor="start" letter-spacing="0">Observed peak</text>
<text x="350" y="590" font-size="12" font-weight="400" fill="#68736D" text-anchor="end" letter-spacing="0">Not set</text>
<text x="24" y="646" font-size="11" font-weight="400" fill="#68736D" text-anchor="start" letter-spacing="0">You can add the observed peak from Today or History.</text>
</g>
<g id="Save action">
<rect x="0" y="713" width="390" height="131" rx="0" fill="#FFFFFF"/>
<line x1="0" y1="713" x2="390" y2="713" stroke="#D7E0DB" stroke-width="1" stroke-linecap="round"/>
<text x="24" y="744" font-size="12" font-weight="500" fill="#68736D" text-anchor="start" letter-spacing="0">Estimated peak: 1:30-3:15 PM</text>
<rect x="24" y="761" width="342" height="50" rx="15" fill="#426B5A"/>
<text x="195.0" y="793" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">Save feeding</text>
</g>
</svg>